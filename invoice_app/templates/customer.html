{% extends 'base.html' %}

{% block content %}
<div class="row">
    <div class="col-md-12">
        <h2 class="mb-4">Customer List</h2>
        
        <div class="card shadow-sm">
            <div class="card-body p-0">
                <table class="table table-striped mb-0 align-middle">
                    <thead class="table-primary">
                        <tr>
                            <th>ID</th>
                            <th>Customer Name</th>
                            <th>Amount Due</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for cust in invoices %}
                        <tr>
                            <td>{{ cust.id }}</td>
                            <td>{{ cust.name }}</td>
                            <td>₹{{ cust.amount }}.00</td>
                        </tr>
                        {% empty %}
                        <tr>
                            <td colspan="3" class="text-center text-muted">No customers found.</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
{% endblock %}
