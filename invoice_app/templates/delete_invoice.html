{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 card shadow-sm p-4">
        <h2 class="mb-4">delete Invoice</h2>
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <p>are you sure you want to delete this invoice</p>
            <button type="submit" class="btn btn-primary">delete Invoice</button>
            <a href="{% url 'invoices' %}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
