{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 card shadow-sm p-4">
        <h2 class="mb-3">Delete Invoice</h2>
        <p>Are you sure you want to delete invoice <strong>{{ invoice.invoice_number }}</strong>?</p>
        <p class="text-muted small">This action cannot be undone.</p>
        
        <form method="POST">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Yes, Delete</button>
            <a href="{% url 'invoices' %}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
